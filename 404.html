  h2 { margin: 10px 0 12px; font-size: clamp(30px, 5vw, 50px); font-weight: 600; line-height: 1.1; letter-spacing: -.02em; }

<script>
  // light streaks, like the home hero (decorative)
  (function () {
    var box = document.getElementById("streaks"), n = window.innerWidth < 600 ? 22 : 48;
    for (var i = 0; i < n; i++) {
      var s = document.createElement("i");
      s.style.left = Math.random() * 100 + "%";
      s.style.animationDuration = 2.5 + Math.random() * 4 + "s";
      s.style.animationDelay = -Math.random() * 6 + "s";

      box.appendChild(s);

  })();
